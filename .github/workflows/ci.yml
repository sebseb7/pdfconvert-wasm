name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Regression Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Cache WASM build artifacts
        id: wasm-cache
        uses: actions/cache@v6.1.0
        with:
          path: |
            poppler.wasm
            poppler.js
          key: ${{ runner.os }}-poppler-wasm-${{ hashFiles('src/**', 'index.js', 'Dockerfile') }}

      - name: Cache test reference files
        id: reference-cache
        uses: actions/cache@v6.1.0
        with:
          path: |
            test/reference/images
            test/reference/text
          key: ${{ runner.os }}-test-reference-${{ hashFiles('test/fixtures/**/*.pdf') }}
          restore-keys: |
            ${{ runner.os }}-test-reference-

      # Poppler CLI (pdftotext/pdftoppm) is only needed to (re)generate the
      # reference files, not to run the regression tests themselves.
      - name: Install system dependencies (Poppler CLI)
        if: steps.reference-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Generate test reference files
        if: steps.reference-cache.outputs.cache-hit != 'true'
        run: npm run test:generate

      # Only reuse the cached binaries on an EXACT key match. A partial
      # restore-keys hit could restore a stale poppler.js built from older
      # sources (missing newly exported functions), so on any key mismatch
      # we rebuild from scratch.
      - name: Build WASM library if needed
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: npm run build

      - name: Run visual and text regression tests
        run: npm test

      - name: Build npm package
        run: npm pack

      - name: Upload npm package artifact
        uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: "*.tgz"
